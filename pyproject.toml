[tool.bandit]
exclude_dirs = ["tests"]
# B311: `random` picks journeys, products and think times; nothing here needs a cryptographic generator
#       (names and ids that must be unique use `secrets`).
skips = ["B311"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
